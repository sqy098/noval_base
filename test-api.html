<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试API内容</title>
</head>
<body>
    <h1>测试GitHub API返回的章节内容</h1>
    <pre id="content"></pre>

    <script>
        async function test() {
            try {
                const response = await fetch('https://api.github.com/repos/sqy098/noval_base/contents/noval-result/chapters/vol-1-ch-1.md');
                const data = await response.json();
                const text = atob(data.content);

                // 显示前500字符
                document.getElementById('content').textContent = text.substring(0, 500);
            } catch (error) {
                document.getElementById('content').textContent = 'Error: ' + error.message;
            }
        }
        test();
    </script>
</body>
</html>
