<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昨日之后 - 无职转生后日谈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Source Han Serif CN", "Microsoft YaHei", serif;
            line-height: 1.8;
            color: #1a1a1a;
            background: #0a0a0a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 80px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 4px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1em;
            color: #555;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.9;
            padding: 20px;
            background: rgba(103, 126, 234, 0.05);
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .description br {
            display: block;
            margin: 8px 0;
        }

        /* 章节列表 */
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 40px;
        }

        nav h2 {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid transparent;
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(90deg, #667eea, #764ba2) border-box;
            border-bottom: 3px solid;
            font-weight: 600;
        }

        .chapter-list {
            list-style: none;
            display: grid;
            gap: 15px;
        }

        .chapter-list li {
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .chapter-list a {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, rgba(103, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            color: #2d3748;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            font-size: 1.1em;
            font-weight: 500;
        }

        .chapter-list a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea, #764ba2);
            transition: width 0.4s ease;
        }

        .chapter-list a:hover::before {
            width: 100%;
            opacity: 0.1;
        }

        .chapter-list a:hover {
            transform: translateX(10px);
            border-color: #667eea;
            box-shadow:
                0 10px 30px rgba(103, 126, 234, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, rgba(103, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .chapter-list a::after {
            content: '→';
            margin-left: auto;
            font-size: 1.3em;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .chapter-list a:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
        }

        footer p {
            margin-bottom: 10px;
        }

        footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px 15px;
            border-radius: 5px;
            display: inline-block;
        }

        footer a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.5em;
            box-shadow:
                0 10px 30px rgba(103, 126, 234, 0.5),
                0 0 0 0 rgba(103, 126, 234, 0.7);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow:
                    0 10px 30px rgba(103, 126, 234, 0.5),
                    0 0 0 0 rgba(103, 126, 234, 0.7);
            }
            50% {
                box-shadow:
                    0 10px 30px rgba(103, 126, 234, 0.5),
                    0 0 0 15px rgba(103, 126, 234, 0);
            }
            100% {
                box-shadow:
                    0 10px 30px rgba(103, 126, 234, 0.5),
                    0 0 0 0 rgba(103, 126, 234, 0);
            }
        }

        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(103, 126, 234, 0.7);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            header {
                padding: 50px 25px;
            }

            h1 {
                font-size: 2.2em;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 1em;
            }

            nav {
                padding: 25px 20px;
            }

            nav h2 {
                font-size: 1.4em;
            }

            .chapter-list a {
                padding: 15px 18px;
                font-size: 1em;
            }

            .back-to-top {
                width: 45px;
                height: 45px;
                bottom: 25px;
                right: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <header>
            <h1>昨日之后</h1>
            <p class="subtitle">无职转生后日谈 × 六面世界综漫</p>
            <p class="description">
                甲龙历465年，阿尔斯·格雷拉特遭遇遗迹事故被静滞。<br>
                130年后的595年，他在陌生的魔导工业时代苏醒。<br>
                父亲的宅邸成为历史遗产，爱夏的人生已经走完。<br>
                一个失去时间的人，在债务、破产、铁路与投机的新世界中，<br>
                与C.C.、安妮丝一同寻找「家」的意义。
            </p>
        </header>

        <nav>
            <h2>第一卷 章节目录</h2>
            <ul class="chapter-list">
                <li><a href="chapter-1.html">第一章　装置上的名字</a></li>
                <li><a href="chapter-2.html">第二章　五百九十五年</a></li>
                <li><a href="chapter-3.html">第三章　去夏利亚的最后一班车</a></li>
                <li><a href="chapter-4.html">第四章　去夏利亚的夜班车</a></li>
            </ul>
        </nav>

        <footer>
            <p>© 2026 昨日之后 | 基于《无职转生》世界观的二次创作</p>
            <p><a href="https://github.com/sqy098/noval_base" target="_blank">📚 GitHub 仓库</a></p>
        </footer>
    </div>

    <a href="#" class="back-to-top" id="backToTop">↑</a>

    <script>
        // Back to top button
        const backToTop = document.getElementById('backToTop');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        backToTop.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 添加进入动画
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('header');
            const nav = document.querySelector('nav');

            header.style.opacity = '0';
            header.style.transform = 'translateY(30px)';
            nav.style.opacity = '0';
            nav.style.transform = 'translateY(30px)';

            setTimeout(() => {
                header.style.transition = 'all 0.8s ease';
                header.style.opacity = '1';
                header.style.transform = 'translateY(0)';
            }, 100);

            setTimeout(() => {
                nav.style.transition = 'all 0.8s ease';
                nav.style.opacity = '1';
                nav.style.transform = 'translateY(0)';
            }, 300);
        });
    </script>
</body>
</html>
