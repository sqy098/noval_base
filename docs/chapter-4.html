<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第四章 去夏利亚的夜班车 - 昨日之后</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Source Han Serif CN", "Microsoft YaHei", serif;
            line-height: 2;
            color: #2d3748;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .back-nav {
            margin-bottom: 25px;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-nav a:hover {
            background: white;
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .content {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .draft-notice {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe8a1 100%);
            border-left: 5px solid #ffc107;
            padding: 18px 22px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255, 193, 7, 0.2);
        }

        .draft-notice strong {
            color: #856404;
            font-weight: 600;
        }

        .chapter-title {
            font-size: 2.2em;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            letter-spacing: 2px;
        }

        .loading {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
            font-size: 1.1em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .chapter-content {
            font-size: 1.15em;
            line-height: 2.2;
            color: #1a202c;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 1.8em;
            text-indent: 2em;
            transition: background 0.3s ease;
        }

        .chapter-content p:hover {
            background: rgba(103, 126, 234, 0.02);
            padding: 5px;
            margin-left: -5px;
            margin-right: -5px;
            border-radius: 5px;
        }

        .chapter-content .separator {
            text-align: center;
            margin: 3em 0;
            color: #cbd5e0;
            font-size: 1.2em;
            letter-spacing: 8px;
        }

        .chapter-nav {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }

        .chapter-nav a {
            flex: 1;
            padding: 15px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(103, 126, 234, 0.4);
        }

        .chapter-nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(103, 126, 234, 0.6);
        }

        .chapter-nav .disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            z-index: 9999;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px 12px;
            }

            .content {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .chapter-title {
                font-size: 1.6em;
                letter-spacing: 1px;
            }

            .chapter-content {
                font-size: 1.05em;
                line-height: 2;
            }

            .chapter-nav {
                flex-direction: column;
            }

            .chapter-nav a {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <div class="container">
        <div class="back-nav">
            <a href="index.html">← 返回目录</a>
        </div>

        <div class="content">
            <div class="draft-notice">
                <strong>提示：</strong> 本章为初稿版本，尚未经过anti-ai处理和最终审核。
            </div>

            <h1 class="chapter-title">第四章　去夏利亚的夜班车</h1>

            <div class="chapter-content" id="chapterContent">
                <div class="loading">加载中</div>
            </div>

            <div class="chapter-nav">
                <a href="chapter-3.html">← 上一章</a>
                <a href="#" class="disabled">下一章 →</a>
            </div>
        </div>
    </div>

    <script>
        // 进度条
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
        });

        // 加载章节
        async function loadChapter() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/sqy098/noval_base/main/noval-result/archives/vol-1-ch-4-draft.md?t=' + Date.now());
                const data = await response.json();
                const text = atob(data.content);

                const lines = text.split('\n');
                const contentLines = lines.filter(line => !line.startsWith('#'));

                const paragraphs = contentLines.join('\n').split('\n\n').filter(p => p.trim());
                const html = paragraphs.map(p => {
                    const trimmed = p.trim();
                    if (trimmed === '---') {
                        return '<div class="separator">***</div>';
                    }
                    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
                }).join('\n');

                document.getElementById('chapterContent').innerHTML = html;

                // 添加段落渐入动画
                const ps = document.querySelectorAll('.chapter-content p');
                ps.forEach((p, index) => {
                    p.style.opacity = '0';
                    p.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        p.style.transition = 'all 0.6s ease';
                        p.style.opacity = '1';
                        p.style.transform = 'translateY(0)';
                    }, index * 50);
                });
            } catch (error) {
                document.getElementById('chapterContent').innerHTML = '<p style="text-align: center; color: #e53e3e;">加载失败，请刷新页面重试。</p>';
                console.error('加载章节失败:', error);
            }
        }

        loadChapter();
    </script>
</body>
</html>
